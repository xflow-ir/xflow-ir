<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="X Flow - AI Workforce for your business" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.55" stop-color="#2a2561"/>
      <stop offset="1" stop-color="#1a1740"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <path id="pl1" d="M150 90 Q 290 90 375 200"/>
    <path id="pl2" d="M90 200 Q 250 200 375 200"/>
    <path id="pl3" d="M150 310 Q 290 310 375 200"/>
    <path id="pr1" d="M1050 90 Q 910 90 825 200"/>
    <path id="pr2" d="M1110 200 Q 950 200 825 200"/>
    <path id="pr3" d="M1050 310 Q 910 310 825 200"/>
    <style>
      .dash { fill:none; stroke:#a78bfa; stroke-opacity:.55; stroke-width:1.6; stroke-dasharray:6 8; animation: flow 1.6s linear infinite; }
      .dash.r { animation-direction: reverse; }
      @keyframes flow { to { stroke-dashoffset:-28; } }
      .gridmove { animation: pan 12s linear infinite; }
      @keyframes pan { to { transform: translate(40px,40px); } }
      .breathe { animation: breathe 5s ease-in-out infinite; transform-origin: 600px 200px; }
      @keyframes breathe { 0%,100% { opacity:.55; transform:scale(.92);} 50% { opacity:1; transform:scale(1.08);} }
      .tw { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity:.15;} 50% { opacity:.9;} }
      .t { font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif; }
      .lbl { font-size:13px; fill:#c4b5fd; letter-spacing:.5px; text-anchor:middle; }
      .rise { animation: rise 1.2s ease-out both; }
      @keyframes rise { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:translateY(0);} }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g class="gridmove"><rect x="-40" y="-40" width="1280" height="480" fill="url(#grid)"/></g>
  <ellipse class="breathe" cx="600" cy="200" rx="360" ry="190" fill="url(#glow)"/>

  <!-- twinkles -->
  <g fill="#fff">
    <circle class="tw" cx="220" cy="48" r="1.8" style="animation-delay:.2s"/>
    <circle class="tw" cx="470" cy="36" r="1.4" style="animation-delay:1.1s"/>
    <circle class="tw" cx="760" cy="52" r="1.8" style="animation-delay:.6s"/>
    <circle class="tw" cx="980" cy="40" r="1.4" style="animation-delay:1.7s"/>
    <circle class="tw" cx="330" cy="365" r="1.6" style="animation-delay:.9s"/>
    <circle class="tw" cx="640" cy="372" r="1.4" style="animation-delay:2.1s"/>
    <circle class="tw" cx="900" cy="360" r="1.8" style="animation-delay:.4s"/>
    <circle class="tw" cx="60" cy="40" r="1.4" style="animation-delay:1.4s"/>
    <circle class="tw" cx="1150" cy="360" r="1.6" style="animation-delay:2.4s"/>
  </g>

  <!-- connections -->
  <use xlink:href="#pl1" href="#pl1" class="dash"/>
  <use xlink:href="#pl2" href="#pl2" class="dash"/>
  <use xlink:href="#pl3" href="#pl3" class="dash"/>
  <use xlink:href="#pr1" href="#pr1" class="dash r"/>
  <use xlink:href="#pr2" href="#pr2" class="dash r"/>
  <use xlink:href="#pr3" href="#pr3" class="dash r"/>

  <!-- data packets -->
  <g fill="#ffffff">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#pl1" href="#pl1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" begin=".7s"><mpath xlink:href="#pl2" href="#pl2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#pl3" href="#pl3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" begin=".4s"><mpath xlink:href="#pr1" href="#pr1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#pr2" href="#pr2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#pr3" href="#pr3"/></animateMotion></circle>
  </g>

  <!-- hubs -->
  <circle cx="375" cy="200" r="5" fill="#a78bfa"/>
  <circle cx="825" cy="200" r="5" fill="#a78bfa"/>

  <!-- agent nodes: left -->
  <g class="t">
    <g transform="translate(150,90)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">SEO Agent</text></g>
    <g transform="translate(90,200)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" begin=".5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin=".5s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">Content Agent</text></g>
    <g transform="translate(150,310)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">Sales Agent</text></g>

    <!-- right -->
    <g transform="translate(1050,90)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" begin=".3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin=".3s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">Voice Agent</text></g>
    <g transform="translate(1110,200)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" begin=".8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin=".8s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">RAG Agent</text></g>
    <g transform="translate(1050,310)"><circle r="26" fill="none" stroke="#a78bfa" stroke-opacity=".5"><animate attributeName="r" values="26;40;26" dur="3s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle><circle r="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/><circle r="6" fill="#c4b5fd"/><text class="lbl" y="48">Support Agent</text></g>
  </g>

  <!-- title -->
  <g class="t" text-anchor="middle">
    <text class="rise" x="600" y="215" font-size="92" font-weight="800" fill="url(#title)" style="animation-delay:.1s">X Flow</text>
    <text class="rise" x="600" y="256" font-size="16" font-weight="600" fill="#a78bfa" letter-spacing="6" style="animation-delay:.4s">AI WORKFORCE FOR YOUR BUSINESS</text>
  </g>
</svg>
